# Development stack. Every port binds to loopback only.
name: silvercord-dev

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: silvercord
      POSTGRES_PASSWORD: silvercord
      POSTGRES_DB: silvercord
    ports:
      - 127.0.0.1:5432:5432
    volumes:
      # Postgres 18 images keep PGDATA under a versioned subdirectory of this path.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, pg_isready -U silvercord -d silvercord]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  valkey:
    image: valkey/valkey:9.1.2
    command: [valkey-server, --appendonly, 'yes']
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - valkey-data:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.13.10
    command: [--config, /etc/livekit.yaml]
    ports:
      - 127.0.0.1:7880:7880
      - 127.0.0.1:7881:7881
      - 127.0.0.1:7882:7882/udp
    volumes:
      - ./livekit/livekit.dev.yaml:/etc/livekit.yaml:ro
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:7880]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - 127.0.0.1:1025:1025
      - 127.0.0.1:8025:8025
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres-data:
  valkey-data:
