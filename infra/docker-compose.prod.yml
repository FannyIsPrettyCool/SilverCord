# Host-native Caddy owns 80/443 alongside IslandMon. No container competes for them.
name: silvercord-prod

x-bounds: &bounds
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
  security_opt: [no-new-privileges:true]

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: info
  DATABASE_URL: postgresql://silvercord:${DATABASE_PASSWORD:?set application password}@postgres:5432/silvercord
  VALKEY_URL: redis://valkey:6379
  JWT_SECRET: ${JWT_SECRET:?set a random JWT secret}
  TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?set a random base64 32-byte key}
  SMTP_URL: ${SMTP_URL:?configure SMTP or explicitly use the staging mailpit profile}
  MAIL_FROM: ${MAIL_FROM:?configure the sender address}
  CORS_ORIGINS: app://bundle
  HIBP_ENABLED: 'false'
  MEDIA_STORAGE_DIR: /data/media
  MEDIA_JOBS_DIR: /data/jobs

x-postgres-image: &postgres-image postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336

services:
  postgres:
    <<: *bounds
    image: *postgres-image
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: silvercord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a random administrator password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes: [postgres-data:/var/lib/postgresql]
    networks: [backend]
    shm_size: 256m
    cpus: 2
    mem_limit: 2g
    pids_limit: 200
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d silvercord']
      interval: 10s
      timeout: 5s
      retries: 12

  valkey:
    <<: *bounds
    image: valkey/valkey:9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd
    command: [valkey-server, --appendonly, 'yes', --maxmemory, 384mb, --maxmemory-policy, noeviction]
    volumes: [valkey-data:/data]
    networks: [backend]
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 100
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 12

  db-init:
    <<: *bounds
    image: *postgres-image
    profiles: [tools]
    user: postgres
    restart: 'no'
    networks: [backend]
    read_only: true
    cap_drop: [ALL]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=16m']
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 50
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: silvercord
      PGPASSWORD: ${POSTGRES_PASSWORD:?set administrator password}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?set a distinct random application password}
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -v app_password="$$DATABASE_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE silvercord LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD %L', :'app_password')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'silvercord') \gexec
        ALTER DATABASE silvercord OWNER TO silvercord;
        GRANT ALL ON SCHEMA public TO silvercord;
        SQL

  api:
    <<: *bounds
    image: ${SILVERCORD_IMAGE:-silvercord-api:current}
    init: true
    read_only: true
    cap_drop: [ALL]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    ports: [127.0.0.1:14000:4000]
    networks: [backend, outbound]
    volumes: [media-storage:/data/media]
    cpus: 2
    mem_limit: 1g
    pids_limit: 150
    stop_grace_period: 15s
    environment:
      <<: *app-env
      HOST: 0.0.0.0
      PORT: '4000'
      TRUST_PROXY: 'true'
      WORKER_ID: '0'
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

  # Media orchestrator: DB, Valkey and storage access, no internet (backend is internal).
  worker:
    <<: *bounds
    image: ${SILVERCORD_IMAGE:-silvercord-api:current}
    init: true
    command: [node, src/worker-main.ts]
    read_only: true
    cap_drop: [ALL]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=32m']
    networks: [backend]
    volumes: [media-storage:/data/media, media-jobs:/data/jobs]
    cpus: 1
    mem_limit: 512m
    pids_limit: 100
    stop_grace_period: 40s
    environment:
      <<: *app-env
      WORKER_ID: '1'
      MEDIA_DECODER: container
    depends_on:
      postgres: {condition: service_healthy}
      valkey: {condition: service_healthy}

  # Hostile-input decoding (ADR-0009): no network, no secrets, only the jobs volume.
  media-decoder:
    <<: *bounds
    image: ${SILVERCORD_DECODER_IMAGE:-silvercord-decoder:current}
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=256m']
    volumes: [media-jobs:/data/jobs]
    cpus: 1
    mem_limit: 1g
    pids_limit: 64
    environment:
      NODE_ENV: production

  mailpit:
    <<: *bounds
    image: axllent/mailpit:v1.31.6@sha256:23fe39e81bde596a918000b3135c0f85dc8bb4c9ea6be274b051143f3e300387
    profiles: [staging]
    user: 1000:1000
    read_only: true
    cap_drop: [ALL]
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    networks: [backend]
    ports: [127.0.0.1:18025:8025]
    environment:
      MP_MAX_MESSAGES: '100'
      MP_DATABASE: /tmp/mailpit.db
      MP_DISABLE_VERSION_CHECK: 'true'
    cpus: 0.25
    mem_limit: 128m
    pids_limit: 50
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  backend:
    internal: true
  outbound:

volumes:
  postgres-data:
  valkey-data:
  media-storage:
  media-jobs:
