# Thin by design: every step calls a pnpm script so CI and local runs match.
name: ci

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'chore/**', 'codex/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Commit messages
        env:
          COMMITS_FROM: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm lint:commits
      - run: pnpm verify:all
      - name: Public site build
        run: pnpm --filter @silvercord/site build
      - name: Backup lifecycle regressions
        run: bash infra/tests/backup.test.sh
      - run: pnpm audit --prod --audit-level high

  integration:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Integration (Testcontainers)
        run: pnpm turbo run test:integration

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Electron end-to-end
        run: xvfb-run --auto-servernum pnpm turbo run test:e2e
      - name: Package and verify fuses
        run: pnpm --filter @silvercord/desktop test:package
